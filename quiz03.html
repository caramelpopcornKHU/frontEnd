<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>입장료 계산기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #4a90e2;
            --background-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary-color: #b0b0b0;
            --error-color: #e91e63;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .container {
            background-color: var(--surface-color);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            animation: fadeIn 1s ease-in-out;
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        h2 {
            font-size: 2rem;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary-color);
            font-weight: 400;
        }

        .input-group input[type="number"] {
            width: calc(100% - 2rem);
            padding: 0.8rem 1rem;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .radio-group span {
             color: var(--text-secondary-color);
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group label {
            background-color: #2c2c2c;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-group input[type="radio"]:checked + label {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--primary-color), #3a7bd5);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        #outputFee {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--success-color);
            text-align: center;
            margin-top: 1.5rem;
            animation: pop 0.5s ease;
        }

        .image-container {
            text-align: center;
            margin-top: 1.5rem;
        }

        .image-container img {
            width: 80px;
            height: 80px;
        }

        .price-info, .night-discount, .event {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #333;
        }
        
        .price-info h2, .night-discount h2, .event h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .event-result {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .event-result span {
            background-color: #2c2c2c;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            color: var(--primary-color);
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container animate__animated animate__fadeInUp">
        <h1>입장료 계산기</h1>
        <div id="output1" style="text-align:center; margin-bottom: 1.5rem; color: var(--text-secondary-color);"></div>

        <div class="input-group">
            <label for="inputAdult">성인 수</label>
            <input type="number" id="inputAdult" value="0">
        </div>
        <div class="input-group">
            <label for="inputChild">어린이 수</label>
            <input type="number" id="inputChild" value="0">
        </div>

        <div class="radio-group">
            <span>단체할인 (5명 이상 20%)</span>
            <input type="radio" id="discountYes" name="personDiscount" value="yes" checked>
            <label for="discountYes">예</label>
            <input type="radio" id="discountNo" name="personDiscount" value="no">
            <label for="discountNo">아니요</label>
        </div>

        <button onclick="show()">계산하기</button>

        <div id="outputFee">0 원</div>

        <div class="image-container">
            <img id="successImage" src="images/smileImg.png" alt="성공" style="display: none;">
            <img id="failureImage" src="images/sadImg.png" alt="실패" style="display: none;">
        </div>

        <div class="price-info">
            <h2>기본 요금 설정</h2>
            <div class="input-group">
                <label for="adultFee">성인 1인당</label>
                <input type="number" id="adultFee" value="10000">
            </div>
            <div class="input-group">
                <label for="childFee">어린이 1인당</label>
                <input type="number" id="childFee" value="5000">
            </div>
        </div>

        <div class="night-discount">
            <h2>야간 할인 (오후 6시 이후)</h2>
            <div class="input-group">
                <label for="adultNight">성인 1인당</label>
                <input type="number" id="adultNight" value="8000">
            </div>
            <div class="input-group">
                <label for="childNight">어린이 1인당</label>
                <input type="number" id="childNight" value="4000">
            </div>
        </div>
    </div>

    <div class="container animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
        <h2>🎉 스타벅스 쿠폰 추첨 이벤트 🎉</h2>
        <div class="input-group">
            <label for="eventPeopleNum">총 입장인원</label>
            <input type="number" id="eventPeopleNum" value="80">
        </div>
        <button onclick="eventLotto()">추첨하기</button>
        <p style="text-align:center; color: var(--text-secondary-color); margin-top: 1.5rem;">
            당첨되신 분들께는 스타벅스 쿠폰을 드립니다!
        </p>
        <div class="event-result">
            <span id="eventNum1">?</span>
            <span id="eventNum2">?</span>
            <span id="eventNum3">?</span>
            <span id="eventNum4">?</span>
            <span id="eventNum5">?</span>
            <span id="eventNum6">?</span>
        </div>
    </div>


    <script src="moment.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let output1 = document.querySelector('#output1');
            setInterval(() => {
                let curTime = moment().format('YYYY-MM-DD HH:mm:ss');
                output1.innerHTML = `<p>${curTime}</p>`;
            }, 1000)
        })

        function show() {
            document.getElementById('successImage').style.display = 'none';
            document.getElementById('failureImage').style.display = 'none';

            const adultCount = parseInt(document.getElementById('inputAdult').value);
            const childCount = parseInt(document.getElementById('inputChild').value);
            let adultPrice = parseInt(document.getElementById('adultFee').value);
            let childPrice = parseInt(document.getElementById('childFee').value);
            const adultNightPrice = parseInt(document.getElementById('adultNight').value);
            const childNightPrice = parseInt(document.getElementById('childNight').value);
            const outputFee = document.getElementById('outputFee');

            if (isNaN(adultCount) || isNaN(childCount) || isNaN(adultPrice) || isNaN(childPrice) || isNaN(adultNightPrice) || isNaN(childNightPrice)) {
                alert('유효한 숫자를 입력해주세요.');
                document.getElementById('failureImage').style.display = 'block';
                outputFee.innerText = '오류';
                return;
            }
            
            const now = new Date();
            const isNightTime = now.getHours() >= 18;
            if (isNightTime) {
                adultPrice = adultNightPrice;
                childPrice = childNightPrice;
            }

            let totalFee = (adultCount * adultPrice) + (childCount * childPrice);
            
            const isDiscount = document.getElementById('discountYes').checked;
            if (isDiscount && (adultCount + childCount >= 5)) {
                totalFee *= 0.8;
            }

            outputFee.innerText = `${totalFee.toLocaleString()} 원`;
            outputFee.classList.add('animate__animated', 'animate__tada');
            document.getElementById('successImage').style.display = 'block';
            
            outputFee.addEventListener('animationend', () => {
                outputFee.classList.remove('animate__animated', 'animate__tada');
            });
        }

        function eventLotto() {
            const eventPeopleNum = parseInt(document.getElementById('eventPeopleNum').value);
            if (isNaN(eventPeopleNum) || eventPeopleNum < 6) {
                alert('추첨 인원은 6명 이상이어야 합니다.');
                return;
            }

            let numbers = new Set();
            while (numbers.size < 6) {
                let rand = Math.floor(Math.random() * eventPeopleNum) + 1;
                numbers.add(rand);
            }

            const sortedNumbers = Array.from(numbers).sort((a, b) => a - b);

            for (let i = 0; i < 6; i++) {
                const el = document.getElementById(`eventNum${i + 1}`);
                el.innerText = `${sortedNumbers[i]}번`;
                el.classList.add('animate__animated', 'animate__bounceIn');
                 el.addEventListener('animationend', () => {
                    el.classList.remove('animate__animated', 'animate__bounceIn');
                });
            }
        }
    </script>
</body>
</html>
