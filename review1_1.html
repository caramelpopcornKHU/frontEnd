<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>연습</title>
        <!-- CSS스타일 -->
        <style> 
            /* body안에 있는 tag중에서 tag의 이름으로 선택하기 */
            p {
                border: 2px solid blue;
                margin-top: 0px;
                margin-bottom: 0px;
            }
            /* body안에 있는 tag중에서 class name으로 선택하기 */
            .group1 {
                color: magenta;
            }

            
            /* body안에 있는 tag중에서 id로 선택하기 */
            #my1 {
                font-size: 2em;
            }
        </style>
    </head>
    <body>

        <h3>연습 1</h3>

        <div>
            <p class="group1">연습입니다.</p>
            <p id="my1">연습입니다.</p>
        </div>

        <div>
            <span class="group1">연습입니다</span>
            <span>연습입니다</span>
        </div>

        <div>
            <input id="input1" type="text" value="홍길동1">
            <button onclick="show()">확인</button>
        </div>

        <div id="output1">
            <!-- <p>결과</p> -->
        </div>
        
        <script>

            function show()  {
                console.log(`show 함수 호출`);

                // 입력상자에서 값을 가지고 와서 화면에 보여주기
                let input1 = document.querySelector('#input1');
                let name = input1.value;

                let output1 = document.querySelector('#output1');
                output1.innerHTML = `<p>결과 : ${name}</p>`;
            }

        </script>

    </body>
</html>
