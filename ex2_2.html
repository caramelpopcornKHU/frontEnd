<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>연습</title>
    </head>
    <body>

        <h1>연습 1</h1>

        <div>
            <input type="radio" name="gender" value="man" checked><span>남자</span>
            <input type="radio" name="gender" value="woman"><span>여자</span>
        </div>

        <div>
            <button onclick="show()">확인</button>
        </div>

        <div id="output1">

        </div>

        <div>
            <!-- 수정: add() 함수에서 접근할 수 있도록 id 추가 -->
            <input type="text" id="num1" value="10">
            <input type="text" id="num2" value="20">
            <button onclick="add()">더하기</button>

            <div id="output2">

            </div>
        </div>

        <!-- moment.js 라이브러리 파일이 이 HTML 파일과 같은 디렉토리에 있어야 합니다. -->
        <!-- 만약 moment.js 파일이 없다면, https://momentjs.com/ 에서 다운로드하여 이 폴더에 넣어주세요. -->
        <script src="moment.js"></script>
        <script>
            function add(){
                // 수정: id를 사용하여 입력 필드에 접근
                let input1 = document.querySelector('#num1');
                let input2 = document.querySelector('#num2');
                
                let inputA = input1.value;
                let inputB = input2.value;

                let a = Number(inputA);
                let b = Number(inputB);

                if(isNaN(a) || isNaN(b)){
                    alert(`사용자가 입력한 값이 숫자가 아닙니다.`);
                    return;
                    
                }

                let result = a + b;

                let output2 = document.querySelector('#output2');
                output2.innerHTML = `더하기 결과 : ${result}`;
            }


            window.addEventListener('DOMContentLoaded', () => {
                console.log(`DOMContentLoaded 이벤트 호출됨. `);

                // 현재 시간 표시하기
                let output1 = document.querySelector('#output1');
                setInterval(() => {
                    
                    let curTime = moment().format('YYYY-MM-DD HH:mm:ss');
                    output1.innerHTML = `<p>${curTime}</p>`;

                }, 1000)
            })

            function show(){
                console.log(`show 함수 호출됨.`);

                let radios = document.getElementsByName('gender');
                let selected = Array.from(radios).find(elem => elem.checked);
                console.log(`선택한 값 ${selected.value}`);

                if(selected.value == 'man'){
                    alert(`남자가 선택되었어요.`);
                } else if(selected.value == 'woman') {
                    alert(`여자가 선택되었어요.`);
                }

                // 수정: show() 함수 내의 중복된 setInterval 제거. 
                // 시간 표시는 DOMContentLoaded 이벤트 리스너에서 이미 처리하고 있습니다.
            }
        </script>

    </body>
</html>
